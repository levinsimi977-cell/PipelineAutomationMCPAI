[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-automation-mcp"
version = "0.1.0"
description = "Pipeline Automation with MCP"
requires-python = ">=3.10"

# ── הוסיפי כאן את הספריות שהפרויקט צריך ──
dependencies = [
    # דוגמאות נפוצות - הוסיפי / הסירי לפי הצורך:
    # "requests>=2.31",
    # "pydantic>=2.0",
    # "openai>=1.0",
    # "anthropic>=0.20",
    # "fastapi>=0.110",
    # "uvicorn>=0.29",
    # "python-dotenv>=1.0",
    jsonschema>=4.0.0,
    jinja2>=3.1.0

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["infra*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
