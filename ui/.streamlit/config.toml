[theme]
# Sky-blue palette matching the run report's own theme (see
# data/reports/templates/run_report.html.j2 --primary/--primary-dark/--bg) —
# replaces Streamlit's default red accent on selected tabs, checkboxes, radio
# buttons, sliders, and primary buttons. Red stays reserved for
# st.error()/validation messages, which use Streamlit's built-in semantic
# error color and are unaffected by this file.
#
# IMPORTANT: Streamlit resolves .streamlit/config.toml relative to the
# directory `streamlit run` is invoked FROM, not relative to the app script.
# Since this project is always launched with `cd ui && streamlit run app.py`,
# this file must live at ui/.streamlit/config.toml (here), not at the
# project root -- a copy at the root is silently ignored.
base = "light"
primaryColor = "#0284C7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F7FF"
textColor = "#1E3A5F"
font = "sans serif"
